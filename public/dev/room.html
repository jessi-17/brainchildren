<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>room preview</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  :root { --ink: #2b2a5e; --muted: #6c6896; --bg: #f4efff; --card: #ffffff; --line: #e2d9f7; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 20px 16px 60px; background: var(--bg); color: var(--ink); font: 14px/1.45 "Segoe UI", system-ui, sans-serif; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 14px; }
  .bar { display: flex; flex-wrap: wrap; gap: 14px 22px; align-items: center; margin: 0 0 18px; padding: 10px 12px; background: var(--card); border: 2px solid var(--line); border-radius: 12px; }
  .bar label { display: inline-flex; gap: 6px; align-items: center; }
  .grid { display: flex; flex-wrap: wrap; gap: 18px; align-items: flex-start; }
  .card { background: var(--card); border: 2px solid var(--line); border-radius: 12px; padding: 8px; }
  .card h2 { font-size: 12px; font-weight: 600; letter-spacing: .04em; margin: 0 0 6px; color: var(--muted); }
  .card h2 b { color: var(--ink); }
  .stack { position: relative; }
  .stack canvas { position: absolute; left: 0; top: 0; image-rendering: pixelated; }
  .stack canvas.debug { image-rendering: auto; }
  .stack canvas[hidden] { display: none; }
  pre { background: var(--card); border: 2px solid var(--line); border-radius: 12px; padding: 10px 12px; font: 12px/1.5 ui-monospace, Consolas, monospace; white-space: pre-wrap; }
  #err { color: #c0245c; }
</style>
<script type="module" src="/dev/room.js"></script>
</head>
<body>
  <h1>the studio · room.js preview</h1>
  <p class="sub">back canvas → seated stand-ins (red line = waist, y−16) → front canvas → walkers, nappers, eggs, ghosts. Toggle the debug overlay to see hotspots, the walk band, seats, nap spots, nest slots and the ghost area.</p>
  <div class="bar">
    <label><input type="checkbox" id="debug"> debug overlay</label>
    <label><input type="checkbox" id="people" checked> stand-ins</label>
    <label>custom hour <input type="range" id="hour" min="0" max="23.75" step="0.25" value="21"> <span id="hourOut"></span></label>
  </div>
  <div class="grid" id="out"></div>
  <pre id="timing">timing…</pre>
  <pre id="err"></pre>
</body>
</html>
