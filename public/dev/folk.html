<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pixel folk</title>
<link rel="icon" href="/favicon.svg">
<style>
  @font-face { font-family: 'Pixelify Sans'; src: url('/fonts/pixelify-sans-latin-400-normal.woff2') format('woff2'); font-weight: 400; font-display: swap; }
  @font-face { font-family: 'Pixelify Sans'; src: url('/fonts/pixelify-sans-latin-600-normal.woff2') format('woff2'); font-weight: 600; font-display: swap; }
  @font-face { font-family: 'Fredoka'; src: url('/fonts/fredoka-latin-400-normal.woff2') format('woff2'); font-weight: 400; font-display: swap; }

  :root {
    --ink: #2b2a5e;
    --ink-soft: #6c6896;
    --paper: #f6f2ff;
    --card: #fffdf8;
    --line: #d9d0f3;
    --pink: #ff6fae;
    --desk: #c98f5e;
    --sofa: #ff9ec7;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px 16px 64px;
    color: var(--ink);
    background: var(--paper);
    background-image:
      radial-gradient(circle at 12% 8%, #ffe3f0 0, transparent 38%),
      radial-gradient(circle at 88% 20%, #e3f3ff 0, transparent 40%),
      radial-gradient(circle at 50% 100%, #fff4cf 0, transparent 45%);
    background-attachment: fixed;
    font: 400 14px/1.4 'Fredoka', 'Segoe UI', system-ui, sans-serif;
  }
  main { max-width: 1320px; margin: 0 auto; }
  h1, h2 { font-family: 'Pixelify Sans', Tahoma, sans-serif; font-weight: 600; margin: 0; }
  h1 { font-size: 30px; }
  h2 { font-size: 18px; margin-bottom: 10px; }
  .sub { color: var(--ink-soft); margin: 4px 0 20px; }
  .sub code { background: #fff; border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }
  section {
    background: var(--card);
    border: 2px solid var(--ink);
    border-radius: 10px;
    box-shadow: 4px 4px 0 #c9b6ff;
    padding: 14px 16px 16px;
    margin: 0 0 22px;
  }
  .row { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: flex-end; }
  .crowd { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 6px; }
  figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 2px; }
  figcaption { font: 400 11px/1.2 'Pixelify Sans', monospace; color: var(--ink-soft); text-align: center; }
  img.px { image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
  .floor { background: linear-gradient(transparent calc(100% - 6px), #efe6ff calc(100% - 6px)); border-radius: 6px; padding: 4px 4px 0; }
  .stage-box { position: relative; display: inline-block; }
  .desk {
    position: absolute; left: -6px; right: -6px; bottom: 0;
    background: var(--desk);
    border-top: 3px solid var(--ink);
    box-shadow: inset 0 4px 0 #e2b183;
  }
  .sofa {
    position: absolute; left: -8px; right: -8px; bottom: 0;
    background: var(--sofa);
    border-top: 3px solid var(--ink);
    border-radius: 6px 6px 0 0;
    box-shadow: inset 0 4px 0 #ffc4dd;
  }
  .waist {
    position: absolute; left: -4px; right: -4px; height: 0;
    border-top: 1px dashed #ff3b6b;
  }
  .rug { background: #ffe9a8; border: 2px solid var(--ink); border-radius: 40px; padding: 10px 18px; }
  .note { font-size: 12px; color: var(--ink-soft); margin-top: 8px; }
  .dark { background: #3a3870; border-radius: 8px; padding: 8px; }
</style>
</head>
<body>
<main>
  <h1>pixel folk</h1>
  <p class="sub" id="consts">loading…</p>

  <section>
    <h2>the crowd · seeds 1–49 · awake · growing · 4×</h2>
    <div class="crowd" id="crowd"></div>
  </section>

  <section>
    <h2>moods</h2>
    <div class="row" id="moods"></div>
  </section>

  <section>
    <h2>stages</h2>
    <div class="row" id="stages"></div>
  </section>

  <section>
    <h2>kinds · held props</h2>
    <div class="row" id="kinds"></div>
  </section>

  <section>
    <h2>moving · walk / type / sleep / lie</h2>
    <div class="row" id="motion"></div>
    <p class="note">dashed line = WAIST_Y. desk and sofa cover everything from WAIST_Y down.</p>
  </section>

  <section>
    <h2>eggs · 1–12 + cold</h2>
    <div class="row" id="eggs"></div>
  </section>

  <section>
    <h2>on a dark wall</h2>
    <div class="row dark" id="dark"></div>
  </section>
</main>
<script type="module" src="/dev/folk.js"></script>
</body>
</html>
